name: experience-agent
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: experience
      POSTGRES_PASSWORD: experience
      POSTGRES_DB: experience_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experience -d experience_agent"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
